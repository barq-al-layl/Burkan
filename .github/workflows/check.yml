# The checks every change has to pass before it is finished: the unit tests, the screenshots, a debug build and lint.
name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push makes the run for the older one pointless.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # The open-source cache, written only by main, so that a pull request cannot leave anything for the next.
          cache-provider: basic
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - run: ./gradlew :app:testDebugUnitTest :app:verifyRoborazziDebug :app:assembleDebug :app:lintDebug

      # What a failure needs to be understood: the test report, and each screenshot beside the one it should match.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/outputs/roborazzi/
          retention-days: 14
