# Commit messages are Conventional Commits, checked by .githooks/commit-msg; see "Commits and pull requests" in
# CONTRIBUTING.md. Pull requests are merged with a merge commit, so each commit on the branch lands on main as it is,
# and release-please reads each one's subject to choose the next version and write the changelog. Every commit must
# pass. The merge commit GitHub adds is left out: its subject, "Merge pull request #…", is no Conventional Commit.
#
# Its body is the pull request's title, and release-please reads a Conventional Commit line in a body as one more
# change. A title that is a feat, fix or perf, or marked breaking, would put its change in the changelog a second
# time, beside its commit's, so such a title is refused. Other types pass, as Dependabot's chore(deps) titles do.
name: Conventional Commits

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the title
        env:
          # Through the environment, never in the script itself: the title is whatever its author wrote.
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ $TITLE =~ ^(feat|fix|perf)(\([a-z0-9-]+\))?!?:\ |^[a-z]+(\([a-z0-9-]+\))?!: ]]; then
            echo "::error title=Pull request title::\"$TITLE\" would be read as one more change. The commits carry the types; write the title as a plain sentence, as in \"Add the quick settings tile\"."
            exit 1
          fi

  commits:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # To list the pull request's commits.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .githooks
          persist-credentials: false

      - name: Check each commit
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          failed=0
          # Through a file, never in the script itself: a subject is whatever its author wrote.
          while IFS=$'\t' read -r sha subject; do
            printf '%s\n' "$subject" > "$RUNNER_TEMP/subject"
            # Strict: a fixup! or squash! commit would land on main as it is, so it is folded away before merging.
            if ! bash .githooks/commit-msg "$RUNNER_TEMP/subject" --strict 2> /dev/null; then
              echo "::error title=Commit ${sha:0:7}::\"$subject\" is not a Conventional Commit. Reword it, as in \"feat: Add the quick settings tile\"; see CONTRIBUTING.md."
              failed=$((failed + 1))
            fi
          done < <(
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST/commits" \
              --jq '.[] | select((.parents | length) == 1) | [.sha, (.commit.message | split("\n")[0])] | @tsv'
          )
          echo "$failed commit(s) do not follow Conventional Commits."
          [[ $failed == 0 ]]
