# Publishes a release. A version is released by pushing its tag, v<versionName>, signed and made by hand on main once
# its changelog is written: this checks the tag, runs the checks, builds the APK signed with the release key, and
# publishes it on GitHub with the changelog, through the same `:app:githubRelease` that works from a computer.
#
# Started by hand instead, it builds the signed APKs of the commit chosen, one for each processor and a universal
# one, and keeps them as an artifact, publishing nothing: to compare them with ones built elsewhere, as F-Droid does
# with every release.
#
# The key is in the secrets of the `release` environment, which only main and the version tags may use.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      # To publish the release.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # All of history, to tell that the tag is on main.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # A release is built from what its tag holds and nothing a cache could have kept from another run.
          cache-disabled: true

      # The build strips the native libraries with the NDK it names; another would give an APK unlike F-Droid's.
      - name: Install the NDK
        run: |
          ndk=$(sed -n 's/^ *ndkVersion = "\(.*\)"$/\1/p' app/build.gradle.kts)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" > /dev/null

      - name: Check
        run: ./gradlew :app:testDebugUnitTest :app:verifyRoborazziDebug :app:lintDebug

      # Only after the checks: the tests and lint run the build's code and its plugins', none of which needs the key.
      - name: Put the release key in place
        env:
          RELEASE_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE }}
        run: |
          printf '%s' "$RELEASE_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.p12"

      - name: Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/release.p12
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:githubRelease

      - name: Build without releasing
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/release.p12
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'workflow_dispatch'
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-*-release.apk
          retention-days: 7
