# A draft of Burkan's build recipe for F-Droid. It goes into a fork of
# https://gitlab.com/fdroid/fdroiddata as metadata/io.github.barqallayl.burkan.yml.
# It has not been run through `fdroid lint` or `fdroid build` yet: see ../f-droid.md.

Categories:
  - System
License: Apache-2.0
AuthorName: Mohammed Barq AL Layl
SourceCode: https://github.com/barq-al-layl/Burkan
IssueTracker: https://github.com/barq-al-layl/Burkan/issues

AutoName: Burkan

RepoType: git
Repo: https://github.com/barq-al-layl/Burkan.git

Builds:
  - versionName: 1.0.0
    versionCode: 1
    # F-Droid wants the full hash of the commit the tag v1.0.0 points at, not the tag's name:
    # `git rev-parse 'v1.0.0^{commit}'`.
    commit: REPLACE_WITH_THE_FULL_HASH_OF_v1.0.0
    subdir: app
    sudo:
      # The project builds with JDK 25. Debian 13 (trixie) has it as a package.
      - apt-get update
      - apt-get install -y openjdk-25-jdk-headless
      - update-java-alternatives -a
    gradle:
      - yes
    prebuild:
      # Nothing may fetch a JDK during the build: take out the plugin and the links that would.
      - sed -i -e '/foojay-resolver/d' ../settings.gradle.kts
      - sed -i -e '/^toolchainUrl/d' ../gradle/gradle-daemon-jvm.properties
      - echo 'org.gradle.java.installations.auto-download=false' >> ../gradle.properties

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+$
CurrentVersion: 1.0.0
CurrentVersionCode: 1
